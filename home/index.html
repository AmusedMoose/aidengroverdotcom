        data-shape: "circle" | "rect" (default rect)     data-density: heavier = harder to shove
    -->
    <main id="stage" class="stage">
        <h1 class="title">Aiden Grover</h1>

        <div class="body portrait" data-shape="circle" data-density="2.5">

        </div>

        <a class="body pill primary" href="../" draggable="false">Portfolio</a>
